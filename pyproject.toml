[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "viepy"
version = "0.0.1b0"
authors = [
    { name = "Cleverton Júnior", email = "clevertonjuniorsantiago@gmail.com" }
]
description = "Create music visualizers easy"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "skia-python>=87.6.0",
    "numpy>=2.4.6",
    "pydub>=0.25.1"
]
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]
